services:
  app:
    container_name: app
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.app
    ports:
      - "127.0.0.1:8888:80"
    environment:
      PORT: "80"
    volumes:
      - app-secrets:/run/secrets:ro
    networks:
      - internal

  vault-agent-app:
    image: openbao/openbao:latest
    container_name: vault-agent-app
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_DEV_ROOT_TOKEN_ID: "root"
    volumes:
      - app-secrets:/run/secrets
      - ./openbao-agent.hcl:/openbao/config/agent.hcl:ro
      - ./run-openbao-agent.sh:/openbao/config/run-openbao-agent.sh:ro
    entrypoint: ["/bin/sh", "/openbao/config/run-openbao-agent.sh"]
    networks:
      - internal

  vault:
    image: openbao/openbao:latest
    container_name: vault
    user: "0"
    ports:
      - "127.0.0.1:8200:8200"
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_DEV_ROOT_TOKEN_ID: "root"
    volumes:
      - vault-data:/openbao/file
      - ./vault.hcl:/openbao/config/vault.hcl:ro
      - ./run-vault.sh:/openbao/config/run-vault.sh:ro
    entrypoint: ["/bin/sh", "/openbao/config/run-vault.sh"]
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - internal

volumes:
  vault-data:
  app-secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=16m,mode=0777

networks:
  internal:
    driver: bridge
