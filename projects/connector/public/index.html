<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connector</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="statusbar" role="status" aria-live="polite">
      <span class="statusbar-dot" data-state="checking" aria-hidden="true"></span>
      <span id="vault-status">Vault: checking authentication…</span>
    </div>

    <main class="page">
      <aside class="connectors">
        <h2>Connectors</h2>
        <div class="sheet">
          <table>
            <tbody id="connector-list"></tbody>
          </table>
        </div>
      </aside>
      <section class="top">
        <h2>Hub</h2>
        <div class="toolbar">
          <button type="button" id="add-button">Add</button>
        </div>
        <div class="sheet">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Last Connection</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="hub-list"></tbody>
          </table>
        </div>
      </section>
    </main>

    <footer class="footer">
      Connector
    </footer>

    <dialog id="add-dialog">
      <form id="add-form" class="dialog-form">
        <h2>Add</h2>
        <label>
          Connector
          <select id="add-connector"></select>
        </label>
        <label>
          Name
          <input id="add-name" name="name" required autocomplete="off" />
        </label>
        <label id="add-user-row" hidden>
          User
          <input id="add-user" name="user" autocomplete="off" />
        </label>
        <label id="add-password-row" hidden>
          Password
          <input id="add-password" name="password" type="password" autocomplete="new-password" />
        </label>
        <p id="add-error" class="dialog-error" hidden></p>
        <div class="dialog-actions">
          <button type="submit">OK</button>
        </div>
      </form>
    </dialog>

    <script src="/app.js"></script>
  </body>
</html>
