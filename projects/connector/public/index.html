<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connector</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="statusbar" role="status" aria-live="polite">
      <span class="statusbar-dot" data-state="checking" aria-hidden="true"></span>
      <span id="vault-status">Vault: checking authentication…</span>
    </div>

    <main class="page">
      <aside class="connectors">
        <h2>Connectors</h2>
        <div class="sheet">
          <table>
            <tbody id="connector-list"></tbody>
          </table>
        </div>
      </aside>
      <section class="top">
        <h2>Hub</h2>
        <div class="toolbar">
          <button type="button">Add</button>
        </div>
        <div class="sheet">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Last Connection</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>

    <footer class="footer">
      Connector
    </footer>

    <script src="/app.js"></script>
  </body>
</html>
