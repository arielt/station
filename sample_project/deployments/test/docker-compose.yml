# Generated by station from station.yaml. Do not edit.
# Environment: test

name: sample_project-test

x-station-monitor:
  agent: true
  hub: true

services:
  vault:
    image: openbao/openbao:latest
    container_name: sample_project-vault-test
    user: "0"
    ports:
      - "127.0.0.1:18200:8200"
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
    volumes:
      - vault-data:/openbao/file
      - ./vault.hcl:/openbao/config/vault.hcl:ro
      - ./run-vault.sh:/openbao/config/run-vault.sh:ro
    entrypoint: ["/bin/sh", "/openbao/config/run-vault.sh"]
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - internal

  vault-agent:
    image: openbao/openbao:latest
    container_name: sample_project-vault-agent-test
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_DEV_ROOT_TOKEN_ID: "root"
    volumes:
      - db-secrets:/run/db-secrets
      - connector-secrets:/run/secrets/connector
      - google_sheet_demo-secrets:/run/secrets/google_sheet_demo
      - login-secrets:/run/secrets/login
      - ./openbao-agent.hcl:/openbao/config/agent.hcl:ro
      - ./run-openbao-agent.sh:/openbao/config/run-openbao-agent.sh:ro
    entrypoint: ["/bin/sh", "/openbao/config/run-openbao-agent.sh"]
    networks:
      - internal

  db:
    container_name: sample_project-db-test
    image: postgres:18
    restart: unless-stopped
    depends_on:
      vault-agent:
        condition: service_started
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_passwd
    volumes:
      - db-data:/var/lib/postgresql
      - db-secrets:/run/secrets:ro
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    logging:
      driver: "json-file"
      options:
        max-file: 5
        max-size: 10m
    networks:
      - internal
    ports:
      - "127.0.0.1:15432:5432"

  connector:
    container_name: sample_project-connector-test
    depends_on:
      db:
        condition: service_started
      vault-agent:
        condition: service_started
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.app
      args:
        STATION_APP: apps/connector
    ports:
      - "127.0.0.1:18888:80"
    environment:
      PORT: "80"
      VAULT_ADDR: "http://vault:8200"
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: sample_project_connector_test
    volumes:
      - connector-secrets:/run/secrets:ro
    networks:
      - internal

  google_sheet_demo:
    container_name: sample_project-google_sheet_demo-test
    depends_on:
      db:
        condition: service_started
      vault-agent:
        condition: service_started
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.app
      args:
        STATION_APP: apps/google_sheet_demo
    ports:
      - "127.0.0.1:18889:80"
    environment:
      PORT: "80"
      VAULT_ADDR: "http://vault:8200"
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: sample_project_google_sheet_demo_test
    volumes:
      - google_sheet_demo-secrets:/run/secrets:ro
    networks:
      - internal

  login:
    container_name: sample_project-login-test
    depends_on:
      db:
        condition: service_started
      vault-agent:
        condition: service_started
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.app
      args:
        STATION_APP: apps/login
    ports:
      - "127.0.0.1:18890:80"
    environment:
      PORT: "80"
      VAULT_ADDR: "http://vault:8200"
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: sample_project_login_test
    volumes:
      - login-secrets:/run/secrets:ro
    networks:
      - internal

volumes:
  db-data:
  vault-data:
  db-secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=16m,mode=0777
  connector-secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=16m,mode=0777
  google_sheet_demo-secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=16m,mode=0777
  login-secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=16m,mode=0777

networks:
  internal:
    driver: bridge
