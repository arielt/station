<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log In</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="login-page">
    <div class="overlay">
      <section class="dialog" role="dialog" aria-labelledby="login-title" aria-modal="true">
        <header class="dialog-header">
          <div class="brand" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="32" height="32">
              <circle cx="12" cy="12" r="12" fill="#ff4500" />
              <circle cx="12" cy="13" r="6.2" fill="#fff" />
              <circle cx="9.6" cy="12.4" r="1.15" fill="#1c1917" />
              <circle cx="14.4" cy="12.4" r="1.15" fill="#1c1917" />
            </svg>
          </div>
          <h1 id="login-title">Log In</h1>
          <p class="legal">
            By continuing, you agree to our
            <a href="https://www.tbd.com/policies/user-agreement" target="_blank" rel="noreferrer">User Agreement</a>
            and acknowledge that you understand the
            <a href="https://www.tbd.com/policies/privacy-policy" target="_blank" rel="noreferrer">Privacy Policy</a>.
          </p>
        </header>

        <p id="login-error" class="error" hidden></p>

        <a class="btn btn-outline" href="/auth/google">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.4H12v4.5h6.5c-.3 1.5-1.2 2.8-2.5 3.6v3h4c2.4-2.2 3.5-5.4 3.5-8.7z" />
            <path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-4-3c-1.1.8-2.5 1.2-3.9 1.2-3 0-5.6-2-6.5-4.7H1.4v3.1C3.4 21.4 7.4 24 12 24z" />
            <path fill="#FBBC05" d="M5.5 14.6A7.2 7.2 0 0 1 5.1 12c0-.9.1-1.8.4-2.6V6.3H1.4A12 12 0 0 0 0 12c0 1.9.5 3.8 1.4 5.4l4.1-2.8z" />
            <path fill="#EA4335" d="M12 4.8c1.7 0 3.3.6 4.5 1.8l3.4-3.4C17.9 1.1 15.2 0 12 0 7.4 0 3.4 2.6 1.4 6.3l4.1 3.1C6.4 6.8 9 4.8 12 4.8z" />
          </svg>
          Continue with Google
        </a>

        <a class="btn btn-outline" href="/auth/github">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M12 .3A12 12 0 0 0 8.2 23.7c.6.1.8-.3.8-.6v-2.1c-3.3.7-4-1.6-4-1.6-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.4 11.4 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.2c0 .3.2.7.8.6A12 12 0 0 0 12 .3z" />
          </svg>
          Continue with GitHub
        </a>

        <div class="separator" role="separator"><span>Or continue with</span></div>

        <form id="login-form" class="form" method="post" action="/login">
          <label for="email">Email or username</label>
          <input id="email" name="email" type="text" autocomplete="username" required />

          <div class="label-row">
            <label for="password">Password</label>
            <a class="forgot" href="/login?error=Password%20reset%20is%20not%20available%20yet.">Forgot password?</a>
          </div>
          <input id="password" name="password" type="password" autocomplete="current-password" required />

          <button class="btn btn-primary" type="submit">Log In</button>
        </form>

        <p class="footer-note">New here? Continue with Google or GitHub to create an account.</p>
      </section>
    </div>
    <script src="/login.js"></script>
  </body>
</html>
